---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
# Vatu: Static Analysis
# Version: 1.1.0
# Author: Michael Bragg <mike@vatu.co.uk>

name: "PHP CodeSniffer"

description: "Check the project against the local PHPCS config."

inputs:

  working-dir:
    description: "Path to PHPCS executable (optional)."
    required: false
    default: 'tools'

  test-command:
    description: "Composer script to run test."
    required: false
    default: 'test-phpcs'

runs:
  using: "composite"

  # Check the project against the local PHPCS config.
  #
  # Performs the following steps:
  # - Install PHP CodeSniffer.
  # - Logs debug information.
  # - Run PHPCS on project-specific files.

  steps:

    - name: "Install PHP CodeSniffer."
      shell: bash
      run: composer update --working-dir="${WORKING_DIR}" --no-interaction --prefer-dist
      env:
        WORKING_DIR: ${{ inputs.working-dir }}

    - name: "Logs debug information."
      shell: bash
      run: |
        php --version
        composer --version
        php "${WORKING_DIR}"/vendor/bin/phpcs -i
      env:
        WORKING_DIR: ${{ inputs.working-dir }}

    - name: "Run PHPCS on the project"
      shell: bash
      run: |
        composer run "${TEST_COMMAND}"
      env:
        TEST_COMMAND: "${{ inputs.test-command }}"
