---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Vatu:    PHP CodeSniffer
# Version: 1.2.0
# Author:  Michael Bragg <mike@vatu.co.uk>

on:
  workflow_call:

    inputs:
      # Runner to be used by the parent workflow.
      runs-on:
        required: false
        type: string
        default: 'ubuntu-24.04'
      # PHP version used by project.
      version-php:
        required: false
        type: string
        default: "7.4"
      # Composer version to be used by this workflow.
      version-composer:
        required: false
        type: string
        default: "v2"

name: "PHP CodeSniffer"

permissions: {}

env:
  COMPOSER_ALLOW_SUPERUSER: "1" # https://getcomposer.org/doc/03-cli.md#composer-allow-superuser

jobs:

  php-codesniffer:

    name: "PHP CodeSniffer"
    runs-on: ${{ inputs.runs-on }}

    steps:

      - name: "Checks out the repository."
        uses: "actions/checkout@v7.0.0"
        with:
          persist-credentials: false

      - name: "Install PHP ${{ inputs.version-php }} with Composer tool."
        uses: "shivammathur/setup-php@2.37.1"
        with:
          php-version: "${VERSION_PHP}"
          coverage: "none"
          ini-values: "memory_limit=-1"
          tools: cs2pr, composer:"${VERSION_COMPOSER}"
          ini-file: none
        env:
          COMPOSER_TOKEN: ${{ secrets.github-token }}
          VERSION_PHP: ${{ inputs.version-php }}
          VERSION_COMPOSER: ${{ inputs.version-composer }}

      - name: "Get Composer Cache Directory."
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: "Sets up Caching."
        uses: "actions/cache@v5.0.5"
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-composer-tools-${{ hashFiles('tools/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-composer-tools-

      - name: "Install dependencies."
        run: composer install --working-dir=tools --no-interaction --prefer-dist

      - name: "Run PHP CodeSniffer Test."
        run: composer run test-phpcs
